<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Uni Tracker">
  <meta name="theme-color" content="#1E293B">
  <title>Uni Tracker – TUM</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F1F5F9; -webkit-text-size-adjust: 100%; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input, textarea, button { font-family: -apple-system, 'Segoe UI', sans-serif; }
    input:focus, textarea:focus { outline: none; }
    textarea { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const T = {
      Mechanik:    { c:"#4338CA", bg:"#EEF2FF", bd:"#A5B4FC" },
      Mathe:       { c:"#6D28D9", bg:"#F5F3FF", bd:"#C4B5FD" },
      "E Technik": { c:"#C2410C", bg:"#FFF7ED", bd:"#FDBA74" },
      IT:          { c:"#15803D", bg:"#F0FDF4", bd:"#86EFAC" },
      Cax:         { c:"#0F766E", bg:"#F0FDFA", bd:"#5EEAD4" },
    };

    const kwRange = kw => {
      const jan4 = new Date(2026, 0, 4);
      const dow = jan4.getDay() || 7;
      const w1Mon = new Date(jan4);
      w1Mon.setDate(jan4.getDate() - (dow - 1));
      const mon = new Date(w1Mon);
      mon.setDate(w1Mon.getDate() + (kw - 1) * 7);
      const fri = new Date(mon);
      fri.setDate(mon.getDate() + 4);
      const f = d => `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
      return `${f(mon)} – ${f(fri)}`;
    };

    const freshWeek = () => ({
      v: [
        {id:"v0",label:"Mechanik",   sub:"Mo", subject:"Mechanik",  done:false},
        {id:"v1",label:"Cax",                  subject:"Cax",       done:false},
        {id:"v2",label:"IT",                   subject:"IT",        done:false},
        {id:"v3",label:"E Technik",            subject:"E Technik", done:false},
        {id:"v4",label:"Mechanik",   sub:"Do", subject:"Mechanik",  done:false},
        {id:"v5",label:"Mechanik ZÜ",          subject:"Mechanik",  done:false},
        {id:"v6",label:"Mathe ZÜ",             subject:"Mathe",     done:false},
      ],
      t: [
        {id:"t0",label:"Mechanik", subject:"Mechanik",  done:false, blatt:""},
        {id:"t1",label:"IT",       subject:"IT",        done:false, blatt:""},
        {id:"t2",label:"E Technik",subject:"E Technik", done:false, blatt:""},
        {id:"t3",label:"Mathe",    subject:"Mathe",     done:false, blatt:""},
      ],
      a: [
        {id:"a0",label:"Mechanik", subject:"Mechanik",  done:false, etest:false},
        {id:"a1",label:"IT",       subject:"IT",        done:false, etest:true },
        {id:"a2",label:"E Technik",subject:"E Technik", done:false, etest:false},
        {id:"a3",label:"Mathe",    subject:"Mathe",     done:false, etest:false},
        {id:"a4",label:"Cax",      subject:"Cax",       done:false, etest:false},
      ],
      notes:"",
    });

    const load = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };
    const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

    const Tag = ({subject}) => {
      const t = T[subject] || {c:"#64748B",bg:"#F1F5F9",bd:"#CBD5E1"};
      return <span style={{background:t.bg,color:t.c,border:`1px solid ${t.bd}`,borderRadius:4,padding:"1px 7px",fontSize:11,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>{subject}</span>;
    };

    const Cb = ({done,subject,onClick}) => {
      const t = T[subject] || {c:"#6366F1"};
      return (
        <button onClick={onClick} style={{width:22,height:22,borderRadius:6,flexShrink:0,border:done?"none":"2px solid #CBD5E1",background:done?t.c:"#fff",display:"flex",alignItems:"center",justifyContent:"center",WebkitAppearance:"none"}}>
          {done && <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 5.5L4.5 8.5L9.5 2.5" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </button>
      );
    };

    const Row = ({item, last, onToggle, extra}) => (
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:last?"none":"1px solid #F1F5F9"}}>
        <Cb done={item.done} subject={item.subject} onClick={onToggle}/>
        <span style={{flex:1,fontSize:14,color:item.done?"#94A3B8":"#1E293B",textDecoration:item.done?"line-through":"none"}}>
          {item.label}
          {item.sub && <span style={{fontSize:12,color:"#94A3B8",marginLeft:5}}>({item.sub})</span>}
        </span>
        <Tag subject={item.subject}/>
        {extra}
      </div>
    );

    const Card = ({title,accent,done,total,children}) => (
      <div style={{background:"#fff",borderRadius:14,marginBottom:14,boxShadow:"0 1px 6px rgba(0,0,0,0.06)",borderLeft:`4px solid ${accent}`}}>
        <div style={{padding:"16px 20px 0"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <span style={{fontSize:15,fontWeight:700,color:"#1E293B"}}>{title}</span>
            <span style={{background:accent+"25",color:accent,borderRadius:999,padding:"2px 10px",fontSize:12,fontWeight:700}}>{done}/{total}</span>
          </div>
        </div>
        <div style={{padding:"0 20px 16px"}}>{children}</div>
      </div>
    );

    function App() {
      const [kw, setKw]     = useState(() => load("uni_kw", 23));
      const [weeks, setWeeks] = useState(() => load("uni_weeks", {23: freshWeek()}));

      useEffect(() => save("uni_kw", kw),    [kw]);
      useEffect(() => save("uni_weeks", weeks), [weeks]);

      const wk  = weeks[kw] ?? freshWeek();
      const upd = fn => setWeeks(p => ({...p, [kw]: fn(p[kw] ?? freshWeek())}));

      const toggle = (sec,id)        => upd(w => ({...w,[sec]:w[sec].map(i=>i.id===id?{...i,done:!i.done}:i)}));
      const patch  = (sec,id,f,val)  => upd(w => ({...w,[sec]:w[sec].map(i=>i.id===id?{...i,[f]:val}:i)}));
      const nav    = d => { const n=kw+d; setKw(n); setWeeks(p=>p[n]?p:{...p,[n]:freshWeek()}); };

      const all   = [...wk.v,...wk.t,...wk.a];
      const doneN = all.filter(i=>i.done).length;
      const pct   = Math.round(doneN/all.length*100);

      return (
        <div style={{fontFamily:"-apple-system,'Segoe UI',sans-serif",background:"#F1F5F9",minHeight:"100vh",padding:`calc(20px + env(safe-area-inset-top)) 16px 40px`}}>
          <div style={{maxWidth:660,margin:"0 auto"}}>

            {/* Header */}
            <div style={{background:"#1E293B",borderRadius:18,padding:"22px 24px",marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
                <button onClick={()=>nav(-1)} style={{background:"#334155",border:"none",color:"#94A3B8",borderRadius:10,padding:"9px 14px",fontSize:12,fontWeight:700}}>← KW {kw-1}</button>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#475569",textTransform:"uppercase",letterSpacing:"0.14em",fontWeight:700,marginBottom:2}}>Kalenderwoche</div>
                  <div style={{fontSize:48,fontWeight:900,lineHeight:1,color:"#F8FAFC"}}>{kw}</div>
                  <div style={{fontSize:13,color:"#64748B",marginTop:5,fontWeight:600}}>{kwRange(kw)}</div>
                  <div style={{fontSize:11,color:"#334155",marginTop:2}}>TU München · Semester 2</div>
                </div>
                <button onClick={()=>nav(1)} style={{background:"#334155",border:"none",color:"#94A3B8",borderRadius:10,padding:"9px 14px",fontSize:12,fontWeight:700}}>KW {kw+1} →</button>
              </div>

              <div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:700,color:"#475569",marginBottom:8}}>
                  <span>Wochenfortschritt</span>
                  <span style={{color:pct===100?"#4ADE80":"#64748B"}}>{doneN} / {all.length} · {pct}%</span>
                </div>
                <div style={{background:"#0F172A",borderRadius:999,height:8}}>
                  <div style={{background:pct===100?"#22C55E":"linear-gradient(90deg,#6366F1,#8B5CF6)",borderRadius:999,height:8,width:pct+"%",transition:"width 0.4s ease",minWidth:pct>0?"8px":"0"}}/>
                </div>
              </div>
              {pct===100 && <div style={{textAlign:"center",marginTop:14,fontSize:14,color:"#4ADE80",fontWeight:700}}>🎉 Alles erledigt – starke Woche!</div>}
            </div>

            {/* Legend */}
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
              {Object.entries(T).map(([n,{c,bg,bd}])=>(
                <span key={n} style={{background:bg,color:c,border:`1.5px solid ${bd}`,borderRadius:999,padding:"4px 13px",fontSize:12,fontWeight:700}}>{n}</span>
              ))}
            </div>

            {/* Vorlesungen */}
            <Card title="📚 Vorlesungen" accent="#4338CA" done={wk.v.filter(i=>i.done).length} total={wk.v.length}>
              {wk.v.map((item,idx)=><Row key={item.id} item={item} last={idx===wk.v.length-1} onToggle={()=>toggle("v",item.id)}/>)}
            </Card>

            {/* Tutorien */}
            <Card title="📝 Tutorien" accent="#6D28D9" done={wk.t.filter(i=>i.done).length} total={wk.t.length}>
              {wk.t.map((item,idx)=>(
                <Row key={item.id} item={item} last={idx===wk.t.length-1} onToggle={()=>toggle("t",item.id)}
                  extra={<input value={item.blatt} onChange={e=>patch("t",item.id,"blatt",e.target.value)} placeholder="Blatt #" style={{width:68,padding:"4px 9px",border:"1.5px solid #E2E8F0",borderRadius:7,fontSize:12,color:"#334155",background:"#F8FAFC"}}/>}
                />
              ))}
            </Card>

            {/* Abgaben */}
            <Card title="⚡ E-Tests & Abgaben" accent="#C2410C" done={wk.a.filter(i=>i.done).length} total={wk.a.length}>
              {wk.a.map((item,idx)=>(
                <Row key={item.id} item={item} last={idx===wk.a.length-1} onToggle={()=>toggle("a",item.id)}
                  extra={
                    <button onClick={()=>patch("a",item.id,"etest",!item.etest)} style={{border:"none",borderRadius:6,padding:"3px 9px",fontSize:11,fontWeight:700,background:item.etest?"#FEF3C7":"#F1F5F9",color:item.etest?"#B45309":"#94A3B8",whiteSpace:"nowrap",flexShrink:0}}>
                      {item.etest?"⚡ E-Test":"Abgabe"}
                    </button>
                  }
                />
              ))}
            </Card>

            {/* Notizen */}
            <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",borderLeft:"4px solid #64748B",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
              <div style={{fontSize:15,fontWeight:700,color:"#1E293B",marginBottom:12}}>📋 Notizen</div>
              <textarea value={wk.notes} onChange={e=>upd(w=>({...w,notes:e.target.value}))} placeholder="Notizen, Deadlines, Wichtiges..." rows={4}
                style={{width:"100%",border:"1.5px solid #E2E8F0",borderRadius:10,padding:"10px 14px",fontSize:14,resize:"vertical",color:"#334155",background:"#F8FAFC",lineHeight:1.6}}
              />
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
